fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--seed': 42
    '--tol': 1e-12
    '--image_idx': [6]
    '--crop_center': True
    '--crop_size': 128
    '--scale': 4
    '--sigma': 100
    '--noise_level': 400
    '--max_iter_cp': 50
    '--alpha': 1.0
    '--theta_cp': 1
    '--sigma_cp': 2
    # TODO: Set these based on best results from Phase 2
    '--p': 2        # UPDATE from Phase 2 results
    '--q': 1        # UPDATE from Phase 2 results
    '--r': 1        # UPDATE from Phase 2 results
    '--lmbda': 1e-3  # UPDATE from Phase 2 results
    '--lmbda_m': 5   # UPDATE from Phase 2 results

varying_args:
  range:
    options:
      '--max_iter': [10, 200, 5]  # 10, 25, 50, 100, 200
      '--sigma_cp': [1.0, 8.0, 3]     # 1.0, 2.0, 8.0
      '--max_iter_cp': [25, 100, 4]   # 25, 50, 75, 100
  groups:
    - options:
        '--theta_cp': 0.5
    - options:
        '--theta_cp': 1.0
    - options:
        '--theta_cp': 2.0
name: final_validation_PANTVCB
description: Final validation on full resolution for PANTVCB
path: experiments/final_validation_PANTVCB
executable: experiments/PANCTV/experiment_ctv.py
executable_command: python
datasets:
  - harvard

fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--image_idx': [2, 6, 8, 17, 25, 32, 42, 49]
    '--crop_center': True
    '--crop_size': 256
    '--scale': 4
    '--sigma': 400  # Adjusted for 256x256 crop
    '--noise_level': 1600
    '--tol': 1e-12
    # TODO: Set ALL parameters based on optimal results from all previous phases
    '--max_iter': 50      # UPDATE from Phase 4 results
    '--max_iter_cp': 50   # UPDATE from Phase 7b results
    '--alpha': 1.0        # UPDATE from Phase 7b results
    '--theta_cp': 1       # UPDATE from Phase 7b results
    '--sigma_cp': 2       # UPDATE from Phase 7b results
    '--p': 2              # UPDATE from Phase 2 results
    '--q': 1              # UPDATE from Phase 2 results
    '--r': 1              # UPDATE from Phase 2 results
    '--lmbda': 1e-3       # UPDATE from Phase 6 results
    '--lmbda_m': 5        # UPDATE from Phase 6 results

varying_args:
  range:
    options:
      '--seed': [0, 100, 10]  # Multiple seeds for statistical validation
fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--seed': 42
    '--tol': 1e-12
    '--image_idx': [6, 17, 42]
    '--crop_center': True
    '--crop_size': 128
    '--scale': 4
    '--max_iter_cp': 50
    '--alpha': 1.0
    '--theta_cp': 1
    '--sigma_cp': 2
    # TODO: Set these based on best results from Phase 2 & 4
    '--max_iter': 50  # UPDATE from convergence study
    '--p': 2          # UPDATE from Phase 2 results
    '--q': 1          # UPDATE from Phase 2 results
    '--r': 1          # UPDATE from Phase 2 results
    '--lmbda': 1e-3   # UPDATE from Phase 2 results
    '--lmbda_m': 5    # UPDATE from Phase 2 results

varying_args:
  range:
    options:
      '--noise_level': [50, 1600, 4]  # 50, 200, 800, 1600
      '--sigma': [25, 800, 4]         # 25, 100, 400, 800 (proportional)
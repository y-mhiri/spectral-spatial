fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--seed': 42
    '--tol': 1e-12
    '--image_idx': [6, 17, 42]
    '--crop_center': True
    '--crop_size': 128
    '--scale': 4
    '--sigma': 100
    '--noise_level': 400
    '--max_iter_cp': 50
    '--alpha1': 1.0
    '--theta_cp': 1
    '--sigma_cp': 2
    # TODO: Set these based on best results from previous phases
    '--max_iter': 50  # UPDATE from convergence study
    '--p': 2          # UPDATE from Phase 2 results
    '--q': 1          # UPDATE from Phase 2 results
    '--r': 1          # UPDATE from Phase 2 results
    '--lmbda': 1e-3   # UPDATE from Phase 6 results
    '--lmbda_m': 5    # UPDATE from Phase 6 results

varying_args:
  range:
    options:
      '--alpha': [0.1, 5.0, 3]              # 0.1, 1.0, 5.0
      '--threshold_param': [1e-8, 1e-5, 4]  # 1e-8, 1e-7, 1e-6, 1e-5
  groups:
    - options:
        '--threshold_type': 'hard'
    - options:
        '--threshold_type': 'soft'
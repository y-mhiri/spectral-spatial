name: final_validation_PANTVGradAlign
description: Final validation on full resolution for PANTVGradAlign
path: experiments/final_validation_PANTVGradAlign
executable: experiments/PANGradAlign/experiment_grad_align.py
executable_command: python
datasets:
  - harvard

fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--image_idx': [2, 6, 8, 17, 25, 32, 42, 49]
    '--crop_center': True
    '--crop_size': 256
    '--scale': 4
    '--sigma': 400  # Adjusted for 256x256 crop
    '--noise_level': 1600
    '--tol': 1e-12
    # TODO: Set ALL parameters based on optimal results from all previous phases
    '--max_iter': 50         # UPDATE from Phase 4 results
    '--max_iter_cp': 50      # UPDATE from Phase 7a results
    '--alpha': 1.0           # UPDATE from Phase 7a results
    '--alpha1': 1.0          # UPDATE from Phase 7a results
    '--theta_cp': 1          # UPDATE from Phase 7a results
    '--sigma_cp': 2          # UPDATE from Phase 7a results
    '--threshold_type': 'soft'  # UPDATE from Phase 7a results
    '--threshold_param': 1e-7   # UPDATE from Phase 7a results
    '--p': 2                 # UPDATE from Phase 2 results
    '--q': 1                 # UPDATE from Phase 2 results
    '--r': 1                 # UPDATE from Phase 2 results
    '--lmbda': 1e-3          # UPDATE from Phase 6 results
    '--lmbda_m': 5           # UPDATE from Phase 6 results

varying_args:
  range:
    options:
      '--seed': [0, 100, 10]  # Multiple seeds for statistical validation
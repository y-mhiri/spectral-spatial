fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--seed': 42
    '--max_iter': 50
    '--tol': 1e-12
    '--image_idx': [17,6]
    '--crop_center': True
    '--crop_size': 64
    '--lmbda': 1e-3
    '--lmbda_m': 5
    '--scale': 4
    '--sigma': 25  # defined relative to image size.
    '--noise_level': 50
    '--max_iter_cp': 50
    '--alpha': 1.0
    '--alpha1': 1.0
    '--theta_cp': 1
    '--sigma_cp': 2
    '--p': 2
    '--q': 2
    '--r': 1

varying_args:

  groups:
    - options:
        '--algorithm': 'PANTVCB'
    - options:
        '--algorithm': 'PANTVGradAlign'
        '--threshold_type': 'soft'
        '--threshold_param': 1
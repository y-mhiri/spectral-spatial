fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--seed': 42
    '--max_iter': 10000
    '--tol': 1e-12
    '--image_idx': "2 17 6"
    '--crop_center': True
    '--crop_size': 256
    '--lmbda_m': 5
    '--scale': 4
    '--sigma': 500  # defined relative to image size.
    '--max_iter_cp': 50
    '--alpha': 1.0
    '--alpha1': 1.0
    '--theta_cp': 1
    '--sigma_cp': 2


varying_args:


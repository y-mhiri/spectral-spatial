fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--seed': 42
    '--max_iter': 1
    '--tol': 1e-12
    '--image_idx': [6, 17]
    '--crop_center': True
    '--crop_size': 256
    '--lmbda': 0.1
    '--lmbda_m': 2
    '--tau': 0.1
    '--p': 1
    '--q': 1
    '--r': 1
    '--sigma': 0.1
    '--scale': 4
    '-- muette': 1e-12
    '-- tresh': 0.03
    '-- epsilon': 1e-12
    '-- weight_type': 'hard'



varying_args:

    groups: 
        - options: 
            '--noise_level': 0.0001
        - options: 
            '--noise_level': 0.001
        - options: 
            '--noise_level': 0.01
        - options: 
            '--noise_level': 0.1


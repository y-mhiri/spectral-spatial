fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--seed': 42
    '--max_iter': 2
    '--tol': 1e-12
    '--image_idx': [17]
    '--crop_center': True
    '--crop_size': 256
    '--lmbda_m': 5
    '--scale': 4
    '--sigma': 500
    '--max_iter_cp': 3
    '--alpha': 1.0
    '--theta_cp': 1           
    '--sigma_cp': 2              



varying_args:
    range:
        options:
            '--noise_level': [100,1000,400]
            
            
            

            
    groups: 
        - options: 
            '--p': 1
            '--q': 1  
            '--r': 1
            '--lmbda': 1e-4
        - options: 
            '--p': 2
            '--q': 2  
            '--r': 1
            '--lmbda': 1e-4
        - options: 
            '--p': "inf"
            '--q': 1  
            '--r': 1
            '--lmbda': 1e-4


        
fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--seed': 42
    '--max_iter': 500
    '--tol': 1e-12
    '--image_idx': [17]
    '--crop_center': True
    '--crop_size': 256
    '--lmbda_m': 2
    '--tau': 0.0006
    '--scale': 6
    '--sigma': 100
    '--max_iter_gp': 3
    '--lmbda': 0.08
    



varying_args:
    range:
        options:
            '--noise_level': [100,1000,400]
            
            
            

            
    groups: 
        - options: 
            '--p': 1
            '--q': 1  
            '--r': 1
        - options: 
            '--p': 2
            '--q': 2  
            '--r': 1
        - options: 
            '--p': "inf"
            '--q': 1  
            '--r': 1


        
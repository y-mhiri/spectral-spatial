fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--seed': 42
    '--max_iter': 1
    '--max_iter_gp': 1
    '--tol': 1e-12
    '--image_idx': [6, 17]
    '--crop_center': True
    '--crop_size': 256
    '--lmbda_m': 2
    '--tau': 0.1
    '--p': 2
    '--q': 2
    '--r': 1
    '--noise_level': 0.001
    '--sigma': 0.1
    '--scale': 4



varying_args:

    groups: 
        - options: 
            '--lmbda': 1e-1
        - options: 
            '--lmbda': 1e-2
        - options: 
            '--lmbda': 1e-3
        - options: 
            '--lmbda': 1e-4
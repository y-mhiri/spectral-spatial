            '--p': 2
            '--q': 1  
            '--r': 1
        - options: 
            '--p': 2
            '--q': 2  
            '--r': 1
        - options: 
            '--p': "inf"
            '--q': 1  
            '--r': 1
        - options: 
            '--p': "inf"
            '--q': 2  
            '--r': 1
        - options: 
            '--p': "inf"
            '--q': "inf"
            '--r': 1
        - options: 
            '--p': 2
            '--q': "inf"
            '--r': 1

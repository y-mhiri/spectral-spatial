fixed_args:
  options:
    '--device': 'cpu'
    '--cuda_avail': True
    '--dtype': 'float32'
    '--seed': 42
    '--max_iter': 10
    '--tol': 1e-12
    '--image_idx': [17]
    '--crop_center': True
    '--crop_size': 256
    '--noise_level': 0.001
    '--sigma': 0.1
    '--scale': 4
    '--lmbda': 1e-2
    '--lmbda_m': 5
    '--max_iter_cp' : 100



